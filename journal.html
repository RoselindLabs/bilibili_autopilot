<main class="page">
  <style>:root.dark .delete-review .danger{color:var(--maibot-destructive,#f5a09a)}:root.dark .delete-one:hover:not(:disabled){color:var(--maibot-destructive,#f5a09a)}</style>
  <header class="head"><div><h1>B站手记</h1><p class="muted" id="state">正在读取</p><p class="muted" id="nextCheck"></p></div><button type="button" id="toggleRun" disabled>读取状态中</button></header>
  <div class="view-nav"><div class="tabs" role="tablist" aria-label="手记视图"><button type="button" id="readTab" role="tab" aria-selected="true" aria-controls="readView">手记</button><button type="button" id="manageTab" role="tab" aria-selected="false" aria-controls="manage" tabindex="-1">管理</button></div><button type="button" id="configHelpButton" aria-expanded="false" aria-controls="configHelp">浏览设置</button><p id="configHelp" class="muted" hidden>打开宿主「插件管理」→「Neko B站手记」→「配置」。节奏、阅读上限、兴趣和模型排在前面；修改后使用原生保存。</p></div>
  <p id="notice" class="notice" role="status" hidden></p>
  <section id="readView" role="tabpanel" aria-labelledby="readTab">
  <form class="controls" id="filters"><label>日期<input type="date" id="day" aria-label="手记日期"></label><button type="button" id="today">今天</button><button type="button" id="all">全部日期</button><label>记录<select id="statusFilter"><option value="read">感想与读过</option><option value="all">全部记录</option><option value="failed">失败／中断</option><option value="unread">未读到正文</option><option value="passed">读过无感</option><option value="cancelled">已停止</option><option value="reading">正在阅读</option></select></label><div class="search"><input id="search" maxlength="200" placeholder="找一个话题或视频" aria-label="搜索手记"><button type="submit">查找</button></div></form>
  <div class="actions view-tools"><button type="button" id="organize" aria-expanded="false" aria-controls="organizeTools">整理手记</button><button type="button" id="refresh">刷新</button><button type="button" id="pendingRecords" hidden></button></div>
  <section class="organize" id="organizeTools" aria-label="整理手记" hidden><div class="actions"><button type="button" id="selectVisible">选中已显示</button><button type="button" id="clearSelected">取消选择</button><button type="button" id="deleteSelected">删除所选</button><span id="selectionCount" class="muted count" role="status">已选 0 条</span></div><p><button type="button" id="cleanFailed">清理全部失败／中断记录</button></p><small>批量清理范围为当前B站账号的全部日期。</small></section>
  <section class="delete-review" id="deleteReview" aria-labelledby="deleteTitle" hidden><h2 id="deleteTitle" tabindex="-1"></h2><ul id="deleteTitles"></ul><p>正文、感想及对应待分享素材将永久删除。已发出的聊天内容保留。</p><div class="actions"><button type="button" id="cancelDelete">取消</button><button type="button" id="confirmDelete" class="danger">永久删除</button></div></section>
  <section aria-label="浏览手记" id="journal" aria-busy="true"><p class="loading">正在翻开手记…</p></section>
  <button type="button" id="more" hidden>继续往前读</button>
  </section>
  <section class="manage-view" id="manage" role="tabpanel" aria-labelledby="manageTab" hidden><h2>账号与运行</h2><div class="actions"><button type="button" data-command="login">扫码登录</button><button type="button" id="logout">退出账号</button><button type="button" id="refreshManage">刷新状态</button></div><dl id="info"></dl><img id="qr" alt="B站登录二维码" width="220" hidden><p class="muted" id="operation"></p>
    <h2>当前采用的设置</h2><p class="muted">来自插件当前运行配置；原生保存后可刷新核对。</p><dl id="runtimeInfo"></dl>
    <h2>整理记录</h2><p id="capacity" class="muted"></p><button type="button" id="manageFailed">查看失败／中断并整理</button>
    <details id="archive"><summary>回看历史记录</summary><form class="controls" id="archiveFilters"><select id="archiveKind" aria-label="历史类型"><option value="visits">旧浏览与预览</option><option value="attempts">评论发送记录</option><option value="decisions">浏览意愿</option><option value="replies">收到的回复</option><option value="reply_attempts">跟进发送记录</option><option value="shares">旧群分享</option></select><input id="archiveSearch" maxlength="200" placeholder="搜索历史" aria-label="搜索历史记录"><button type="submit">查找</button></form><p id="archiveNotice" role="status" class="muted"></p><div id="archiveRows"></div><div class="actions"><button type="button" id="archivePrev">上一页</button><span id="archivePage" class="muted"></span><button type="button" id="archiveNext">下一页</button></div></details>
    <details><summary>旧评论核对与手动检查</summary><p class="muted">以下检查会调用模型；评论预览不生成阅读手记。</p><div class="actions"><button type="button" data-command="preview">预览旧评论一轮</button><button type="button" data-command="replies">检查跟进预览</button></div><form id="ackForm" class="controls"><label>已核对的BV号<input id="ackBvid" maxlength="12" pattern="BV[0-9A-Za-z]{10}" required></label><button type="submit">标记已核对</button></form></details>
  </section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let generation=0,next='',loading=false,busy=false,first=true,currentAccount=null,lastDay='';
let archiveGeneration=0,archivePage=1,archivePages=1,archiveLoading=false;
let editing=false,deleteToken='',deleteReturn=null,view='read',paused=true,canControl=false;const selected=new Set();
function setEditing(value){editing=value;document.body.classList.toggle('editing',editing);$('organizeTools').hidden=!editing;$('organize').setAttribute('aria-expanded',String(editing));$('organize').textContent=editing?'完成整理':'整理手记';clearDeletion()}
function showView(value){view=value;$('readView').hidden=view!=='read';$('manage').hidden=view!=='manage';for(const name of ['read','manage']){const tab=$(name+'Tab');tab.setAttribute('aria-selected',String(name===view));tab.tabIndex=name===view?0:-1}setEditing(false);$('archive').open=false;clearArchive()}
for(const name of ['read','manage']){$(name+'Tab').onclick=()=>showView(name);$(name+'Tab').onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?'read':e.key==='End'?'manage':view==='read'?'manage':'read';showView(next);$(next+'Tab').focus()}}}
$('configHelpButton').onclick=()=>{const open=$('configHelp').hidden;$('configHelp').hidden=!open;$('configHelpButton').setAttribute('aria-expanded',String(open))};
function failedRecords(organize=false){showView('read');first=false;$('day').value='';$('search').value='';$('statusFilter').value='failed';setEditing(organize);refresh()}
$('pendingRecords').onclick=()=>failedRecords();$('manageFailed').onclick=()=>failedRecords(true);$('toggleRun').onclick=()=>command(paused?'start':'pause');$('refreshManage').onclick=()=>refresh();
function clearDeletion(){selected.clear();deleteToken='';$('deleteReview').hidden=true;$('deleteTitles').replaceChildren();document.querySelectorAll('.pick input').forEach(c=>c.checked=false);selectionControls()}
function selectionControls(){$('selectionCount').textContent='已选 '+selected.size+' 条';$('deleteSelected').disabled=loading||busy||!selected.size;$('clearSelected').disabled=loading||busy||!selected.size;document.querySelectorAll('.pick input').forEach(c=>c.disabled=loading||busy);$('confirmDelete').disabled=loading||busy||!deleteToken}
function clearArchive(){++archiveGeneration;archivePage=1;archivePages=1;archiveLoading=false;$('archiveRows').replaceChildren();$('archivePage').textContent='';$('archiveNotice').textContent='';$('archivePrev').disabled=$('archiveNext').disabled=true}
const labels={noted:'',passed:'暂时没有更多感想',unread:'没有读到正文',failed:'这次阅读未完成',cancelled:'这次阅读已停止',interrupted:'这次阅读中断了',reading:'正在阅读'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function note(text,error=false){$('notice').textContent=text;$('notice').hidden=!text;$('notice').classList.toggle('error',error)}
function controls(){document.querySelectorAll('button').forEach(b=>b.disabled=loading||busy);$('toggleRun').disabled=loading||busy||!canControl;document.querySelectorAll('[data-reading]').forEach(b=>b.disabled=true);$('archivePrev').disabled=loading||busy||archiveLoading||archivePage<=1;$('archiveNext').disabled=loading||busy||archiveLoading||archivePage>=archivePages;$('journal').setAttribute('aria-busy',String(loading));$('more').hidden=!next;selectionControls()}
function draw(entries,append){if(!append){$('journal').replaceChildren();lastDay=''}if(!entries.length&&!append){$('journal').append(el('p','这段时间还没有留下手记。','empty'));return}
 for(const row of entries){const date=row.time.slice(0,10);if(date!==lastDay){$('journal').append(el('h2',date,'day'));lastDay=date}const article=el('article',undefined,'entry');article.id='entry-'+row.id;const meta=el('div',undefined,'meta'),time=el('time',row.time.slice(11,16));time.dateTime=row.time;meta.append(time);if(row.topic)meta.append(el('span',row.topic));const remove=el('button',row.status==='reading'?'阅读中':'删除','delete-one');remove.type='button';remove.setAttribute('aria-label','删除手记：'+row.video.title);if(row.status==='reading'){remove.dataset.reading='true';remove.disabled=true}else{const label=el('label',undefined,'pick'),box=el('input');box.type='checkbox';box.value=row.id;box.setAttribute('aria-label','选择手记：'+row.video.title);box.checked=selected.has(row.id);box.onchange=()=>{if(box.checked&&selected.size>=200){box.checked=false;note('一次最多选择200条手记',true);return}box.checked?selected.add(row.id):selected.delete(row.id);deleteToken='';$('deleteReview').hidden=true;selectionControls()};label.append(box,el('span','选择'));meta.prepend(label);remove.onclick=()=>prepareDelete({ids:row.id},remove)}meta.append(remove);article.append(meta);
 article.append(el('p',row.thought||row.reason||labels[row.status]||'','thought'));if(row.status!=='noted'&&row.status!=='passed'&&row.reason)article.append(el('small',labels[row.status]||row.status));
 const source=el('div',undefined,'source'),link=el('a',row.video.title);if(/^BV[0-9A-Za-z]{10}$/.test(row.bvid)){link.href='https://www.bilibili.com/video/'+row.bvid;link.target='_blank';link.rel='noopener noreferrer'}source.append(link,el('span',row.video.up_name?' · '+row.video.up_name:'' ,'muted'));article.append(source);
  for(const old of row.related||[]){const related=el('details',undefined,'related');if(old.deleted)related.append(el('summary','原记录已删除'));else related.append(el('summary','想起之前 · '+old.title),el('p',old.thought));article.append(related)}
 if(row.evidence_quote){const details=el('details'),summary=el('summary','读到的依据 · '+(row.source||'正文'));details.append(summary,el('p',row.evidence_quote,'quote'));if(row.coverage)details.append(el('small',row.coverage));article.append(details)}
 if(row.sharing)article.append(el('p',row.sharing,'sharing'));else if(row.share_reason){const d=el('details');d.append(el('summary','想到可以聊聊'),el('p',row.share_reason));article.append(d)}$('journal').append(article)}
}
function overview(value){const changed=currentAccount!==null&&currentAccount!==value.account;if(changed){showView('read');$('search').value='';$('statusFilter').value='read';first=true;$('journal').replaceChildren();next='';lastDay='';$('more').hidden=true}currentAccount=value.account;paused=value.paused===true;canControl=value.can_control===true;$('toggleRun').textContent=paused?'恢复浏览':'暂停浏览';$('state').textContent=value.state;$('nextCheck').textContent='下次考虑 · '+(value.next_check||'—');$('info').replaceChildren();for(const [name,key] of [['账号','account'],['运行模式','mode'],['暂停原因','pause_reason'],['最近意愿','choice'],['阅读结果','last_round'],['今日视频','views'],['读取恢复','read_recovery'],['模型用量','model_usage'],['待核对评论','unresolved']]){$('info').append(el('dt',name),el('dd',value[key]||'—'))}$('runtimeInfo').replaceChildren();for(const [name,key] of [['浏览节奏','runtime_settings'],['自主判断','decision_model'],['阅读感想','reflection_model'],['分享机会','sharing_settings'],['旧功能','legacy_settings']])$('runtimeInfo').append(el('dt',name),el('dd',value[key]||'—'));const summary=value.journal_summary,failed=summary?(summary.counts.failed||0)+(summary.counts.interrupted||0):0;$('pendingRecords').hidden=!failed;$('pendingRecords').textContent='失败／中断 '+failed+' 条';$('capacity').textContent=summary?'当前账号 '+summary.account_total+' 条；所有账号共用容量 '+summary.capacity_used+' / '+summary.capacity+' 条。删除后需自行恢复已暂停的浏览。':'正在读取记录容量';$('operation').textContent=value.operation||'';if(typeof value.qr==='string'&&value.qr.startsWith('data:image/png;base64,')){$('qr').src=value.qr;$('qr').hidden=false}else{$('qr').removeAttribute('src');$('qr').hidden=true}return changed}
async function refresh(append=false){if(busy)return;const own=++generation;loading=true;if(!append){next='';clearDeletion()}controls();try{const status=await window.maibot.query('overview');if(own!==generation)return;const changed=overview(status);if(changed){append=false;$('journal').replaceChildren();next=''}const result=await window.maibot.query('journal',{day:first?'today':$('day').value,before:append?next:'',query:$('search').value.trim(),status:$('statusFilter').value});if(own!==generation)return;if(first){$('day').value=result.today;first=false}draw(result.entries,append);next=result.next;note('');if(!result.logged_in){clearDeletion();$('journal').replaceChildren(el('p','登录B站后，新的阅读经历会留在这里。','empty'))}}catch(e){if(own===generation){note('手记读取失败：'+e.message,true);if(first)$('journal').replaceChildren();}}finally{if(own===generation){loading=false;controls()}}}
async function prepareDelete(args,trigger){if(busy||loading)return;busy=true;deleteToken='';deleteReturn=trigger;$('deleteReview').hidden=true;controls();const own=generation;try{const result=await window.maibot.query('prepare_delete',args);if(own!==generation)return;if(result.account!==currentAccount){clearDeletion();clearArchive();$('journal').replaceChildren();next='';lastDay='';throw Error('账号已改变，请刷新手记')}if(!result.count){note('没有需要清理的失败／中断记录');return}deleteToken=result.token;$('deleteTitle').textContent='删除这 '+result.count+' 条手记？';$('confirmDelete').textContent='永久删除 '+result.count+' 条';$('deleteTitles').replaceChildren(...result.titles.map(t=>el('li',t)));if(result.count>result.titles.length)$('deleteTitles').append(el('li','另有 '+(result.count-result.titles.length)+' 条'));$('deleteReview').hidden=false;$('deleteTitle').focus()}catch(e){note('无法准备删除：'+e.message,true)}finally{busy=false;controls()}}
async function deleteEntries(){if(busy||loading||!deleteToken)return;const token=deleteToken;busy=true;controls();try{const result=await window.maibot.action('delete_journal',{token});if(!result?.ok)throw Error(result?.message||'删除未完成');++generation;clearDeletion();clearArchive();$('archive').open=false;$('journal').replaceChildren();next='';lastDay='';$('info').replaceChildren();$('operation').textContent='';note(result.message);busy=false;await refresh();if(!$('notice').classList.contains('error'))note(result.message);$('organize').focus()}catch(e){deleteToken='';$('deleteReview').hidden=true;note(/cancelled|取消/i.test(e.message)?'已取消删除':e.message,!/cancelled|取消/i.test(e.message));deleteReturn?.focus()}finally{busy=false;controls()}}
$('organize').onclick=()=>setEditing(!editing);$('selectVisible').onclick=()=>{clearDeletion();for(const box of document.querySelectorAll('.pick input')){if(selected.size>=200)break;box.checked=true;selected.add(box.value)}selectionControls()};$('clearSelected').onclick=clearDeletion;$('deleteSelected').onclick=()=>prepareDelete({ids:[...selected].join(',')},$('deleteSelected'));$('cleanFailed').onclick=()=>prepareDelete({failed:true},$('cleanFailed'));$('cancelDelete').onclick=()=>{deleteToken='';$('deleteReview').hidden=true;deleteReturn?.focus();controls()};$('confirmDelete').onclick=deleteEntries;
async function command(action){if(busy||loading)return;busy=true;controls();try{const result=await window.maibot.action('command',{command:'/bili_auto '+action});if(!result?.ok)throw new Error(result?.message||'操作未完成');note(result.message);busy=false;await refresh()}catch(e){note(e.message,true)}finally{busy=false;controls()}}
async function archive(page=1){if(busy)return;const own=++archiveGeneration,account=currentAccount;archiveLoading=true;controls();try{const value=await window.maibot.query('records',{kind:$('archiveKind').value,search:$('archiveSearch').value.trim(),page});if(own!==archiveGeneration||account!==currentAccount)return;$('archiveRows').replaceChildren();for(const row of value.rows){const item=el('article',undefined,'entry');item.append(el('small',row.time+' · '+row.outcome+' · '+row.mode),el('h3',row.title||row.bvid||'历史记录'));for(const [label,key] of [['当时内容','comment'],['说明','reason'],['收到的回复','incoming'],['回复目标','target']])if(row[key])item.append(el('p',label+'：'+row[key],'quote'));if(/^BV[0-9A-Za-z]{10}$/.test(row.bvid)){const a=el('a','查看原视频');a.href='https://www.bilibili.com/video/'+row.bvid;a.target='_blank';a.rel='noopener noreferrer';item.append(a)}$('archiveRows').append(item)}archivePage=value.pagination.page;archivePages=value.pagination.pages;$('archivePage').textContent=archivePage+' / '+archivePages;$('archiveNotice').textContent=value.rows.length?'':'没有找到匹配的历史记录'}catch(e){if(own===archiveGeneration)$('archiveNotice').textContent='历史读取失败：'+e.message}finally{if(own===archiveGeneration){archiveLoading=false;controls()}}}
async function manageAction(name,args={}){if(busy||loading)return;busy=true;controls();try{const result=await window.maibot.action(name,args);if(!result?.ok)throw Error(result?.message||'操作未完成');if(name==='logout'){++generation;showView('read');currentAccount=null;canControl=false;next='';lastDay='';first=true;$('search').value='';$('day').value='';$('statusFilter').value='read';$('journal').replaceChildren();$('info').replaceChildren();$('runtimeInfo').replaceChildren();$('capacity').textContent='';$('pendingRecords').hidden=true;$('nextCheck').textContent='';$('operation').textContent='';$('state').textContent='已退出账号';$('qr').removeAttribute('src');$('qr').hidden=true;$('archive').open=false}note(result.message);busy=false;await refresh()}catch(e){note(/cancelled|取消/i.test(e.message)?'已取消操作':e.message,!/cancelled|取消/i.test(e.message))}finally{busy=false;controls()}}
$('archive').ontoggle=()=>{if($('archive').open)archive(1)};$('archiveFilters').onsubmit=e=>{e.preventDefault();archive(1)};$('archiveKind').onchange=()=>archive(1);$('archivePrev').onclick=()=>archive(archivePage-1);$('archiveNext').onclick=()=>archive(archivePage+1);$('logout').onclick=()=>manageAction('logout');$('ackForm').onsubmit=e=>{e.preventDefault();if($('ackForm').reportValidity())manageAction('ack',{bvid:$('ackBvid').value.trim()})};
$('filters').onsubmit=e=>{e.preventDefault();first=false;refresh()};$('statusFilter').onchange=()=>{first=false;refresh()};$('day').onchange=()=>{first=false;refresh()};$('refresh').onclick=()=>refresh();$('more').onclick=()=>refresh(true);$('all').onclick=()=>{first=false;$('day').value='';refresh()};$('today').onclick=()=>{first=true;refresh()};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));
window.maibot.ready.then(()=>{refresh();setInterval(async()=>{if(document.hidden||loading||busy)return;const own=generation;try{const value=await window.maibot.query('overview');if(own===generation){if(overview(value))refresh();else controls()}}catch(e){if(own===generation)note('状态读取失败：'+e.message,true)}},5000)});
})();
</script>
