<style>
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.75 var(--maibot-font-body,system-ui,sans-serif);color:var(--maibot-foreground,#202c3b);background:var(--maibot-background,#f7f8fa);scrollbar-color:var(--maibot-muted,#576779) var(--maibot-background,#f7f8fa)}button,input,select{font:inherit;color:inherit}button,input,select{border:1px solid var(--maibot-border,#d6dde5);border-radius:8px;background:var(--maibot-surface,#fff);min-height:44px;padding:7px 12px}button{cursor:pointer}button:disabled{cursor:default;color:var(--maibot-muted,#576779)}button:hover:not(:disabled){background:var(--maibot-soft,#edf1f6)}:focus-visible{outline:2px solid var(--maibot-primary,#2563b4);outline-offset:3px}::selection{background:var(--maibot-primary,#2563b4);color:var(--maibot-primary-foreground,#fff)}input{caret-color:var(--maibot-primary,#2563b4);min-width:0}input::placeholder{color:var(--maibot-muted,#576779)}a{color:var(--maibot-primary,#2563b4);text-underline-offset:4px}h1,h2,h3,p{margin:0}h1{font-size:1.5rem;line-height:1.4}h2{font-size:1.15rem}h3{font-size:1rem}.page{max-width:1024px;padding:28px 24px;margin:auto}.head,.controls,.meta,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between;margin-bottom:24px}.head>div{min-width:0}.muted,small,time{color:var(--maibot-muted,#576779)}small,time,.meta,.controls{font-size:.875rem}.controls{gap:8px;margin:20px 0 26px}.controls label{display:flex;align-items:center;gap:8px}.controls input[type=date]{max-width:165px}.search{display:flex;gap:8px;margin-left:auto;min-width:0}.search input{width:190px;max-width:100%}.day{margin:32px 0 10px}.entry{padding:20px 0 28px;overflow-wrap:anywhere;max-width:78ch}.entry+.entry{border-top:1px solid var(--maibot-border,#d6dde5)}.thought{margin:10px 0 14px;white-space:pre-wrap;line-height:1.9}.source{font-size:.875rem}.related{margin:14px 0;padding:13px 16px;background:var(--maibot-soft,#edf1f6);border-radius:8px}.related p{margin-top:6px;white-space:pre-wrap}.entry details{margin-top:12px;font-size:.875rem}.entry summary{color:var(--maibot-muted,#576779);cursor:pointer;min-height:32px}.quote{margin:8px 0;white-space:pre-wrap}.notice,.empty{padding:16px;background:var(--maibot-soft,#edf1f6);border-radius:8px;margin:16px 0}.notice.error{color:var(--maibot-destructive,#9b3030)}.manage{margin-top:32px;padding:18px;background:var(--maibot-soft,#edf1f6);border-radius:8px}.manage summary{cursor:pointer;font-weight:600}.manage .actions{margin:16px 0}.manage dl{margin:16px 0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 18px;font-size:.875rem}.manage dt{color:var(--maibot-muted,#576779)}.manage dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.foot{margin-top:28px;font-size:.875rem}.sharing{margin-top:12px;font-size:.875rem;color:var(--maibot-muted,#576779)}#qr{width:220px;max-width:100%;margin-top:16px}.loading{color:var(--maibot-muted,#576779)}[hidden]{display:none!important}@media(max-width:640px){.page{padding:20px 16px}.head{align-items:flex-start;margin-bottom:20px}.controls{align-items:flex-start}.search{margin-left:0;flex-basis:100%}.search input{flex:1;width:0}.entry{padding-bottom:24px}.manage dl{grid-template-columns:1fr;gap:4px}.manage dd{margin-bottom:10px}.thought{line-height:1.85}}
</style>
<style>:root{color-scheme:light}:root.dark{color-scheme:dark}.page{max-width:920px}.entry{max-width:none}</style>
<main class="page">
  <header class="head"><div><h1>B站手记</h1><p class="muted" id="state">正在读取</p></div><button type="button" id="refresh">刷新</button></header>
  <p id="notice" class="notice" role="status" hidden></p>
  <form class="controls" id="filters"><label>日期<input type="date" id="day" aria-label="手记日期"></label><button type="button" id="today">今天</button><button type="button" id="all">全部日期</button><div class="search"><input id="search" maxlength="200" placeholder="找一个话题或视频" aria-label="搜索手记"><button type="submit">查找</button></div></form>
  <section aria-label="浏览手记" id="journal" aria-busy="true"><p class="loading">正在翻开手记…</p></section>
  <button type="button" id="more" hidden>继续往前读</button>
  <details class="manage" id="manage"><summary>浏览与账号管理</summary><div class="actions"><button type="button" data-command="start">恢复浏览</button><button type="button" data-command="pause">暂停浏览</button><button type="button" data-command="login">扫码登录</button><button type="button" id="logout">退出账号</button></div><dl id="info"></dl><img id="qr" alt="B站登录二维码" hidden><p class="muted" id="operation"></p>
    <details id="archive"><summary>回看历史记录</summary><form class="controls" id="archiveFilters"><select id="archiveKind" aria-label="历史类型"><option value="visits">旧浏览与预览</option><option value="attempts">评论发送记录</option><option value="decisions">浏览意愿</option><option value="replies">收到的回复</option><option value="reply_attempts">跟进发送记录</option><option value="shares">旧群分享</option></select><input id="archiveSearch" maxlength="200" placeholder="搜索历史" aria-label="搜索历史记录"><button type="submit">查找</button></form><p id="archiveNotice" role="status" class="muted"></p><div id="archiveRows"></div><div class="actions"><button type="button" id="archivePrev">上一页</button><span id="archivePage" class="muted"></span><button type="button" id="archiveNext">下一页</button></div></details>
    <details><summary>核对与手动检查</summary><div class="actions"><button type="button" data-command="preview">手动预览一轮</button><button type="button" data-command="replies">检查跟进预览</button></div><form id="ackForm" class="controls"><label>已核对的BV号<input id="ackBvid" maxlength="12" pattern="BV[0-9A-Za-z]{10}" required></label><button type="submit">标记已核对</button></form></details>
  </details>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let generation=0,next='',loading=false,busy=false,first=true,currentAccount=null,lastDay='';
let archiveGeneration=0,archivePage=1,archivePages=1,archiveLoading=false;
function clearArchive(){++archiveGeneration;archivePage=1;archivePages=1;archiveLoading=false;$('archiveRows').replaceChildren();$('archivePage').textContent='';$('archiveNotice').textContent='';$('archivePrev').disabled=$('archiveNext').disabled=true}
const labels={noted:'',passed:'暂时没有更多感想',unread:'没有读到正文',failed:'这次阅读未完成',cancelled:'这次阅读已停止',interrupted:'这次阅读中断了',reading:'正在阅读'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function note(text,error=false){$('notice').textContent=text;$('notice').hidden=!text;$('notice').classList.toggle('error',error)}
function controls(){document.querySelectorAll('button').forEach(b=>b.disabled=loading||busy);$('archivePrev').disabled=loading||busy||archiveLoading||archivePage<=1;$('archiveNext').disabled=loading||busy||archiveLoading||archivePage>=archivePages;$('journal').setAttribute('aria-busy',String(loading));$('more').hidden=!next}
function draw(entries,append){if(!append){$('journal').replaceChildren();lastDay=''}if(!entries.length&&!append){$('journal').append(el('p','这段时间还没有留下手记。','empty'));return}
 for(const row of entries){const date=row.time.slice(0,10);if(date!==lastDay){$('journal').append(el('h2',date,'day'));lastDay=date}const article=el('article',undefined,'entry');article.id='entry-'+row.id;const meta=el('div',undefined,'meta'),time=el('time',row.time.slice(11,16));time.dateTime=row.time;meta.append(time);if(row.topic)meta.append(el('span',row.topic));article.append(meta);
 article.append(el('p',row.thought||row.reason||labels[row.status]||'','thought'));if(row.status!=='noted'&&row.status!=='passed'&&row.reason)article.append(el('small',labels[row.status]||row.status));
 const source=el('div',undefined,'source'),link=el('a',row.video.title);if(/^BV[0-9A-Za-z]{10}$/.test(row.bvid)){link.href='https://www.bilibili.com/video/'+row.bvid;link.target='_blank';link.rel='noopener noreferrer'}source.append(link,el('span',row.video.up_name?' · '+row.video.up_name:'' ,'muted'));article.append(source);
 for(const old of row.related||[]){const related=el('div',undefined,'related');related.append(el('small','想起之前 · '+old.title),el('p',old.thought));article.append(related)}
 if(row.evidence_quote){const details=el('details'),summary=el('summary','读到的依据 · '+(row.source||'正文'));details.append(summary,el('p',row.evidence_quote,'quote'));if(row.coverage)details.append(el('small',row.coverage));article.append(details)}
 if(row.sharing)article.append(el('p',row.sharing,'sharing'));else if(row.share_reason){const d=el('details');d.append(el('summary','想到可以聊聊'),el('p',row.share_reason));article.append(d)}$('journal').append(article)}
}
function overview(value){const changed=currentAccount!==null&&currentAccount!==value.account;if(changed){$('journal').replaceChildren();next='';lastDay='';$('more').hidden=true;clearArchive();$('archive').open=false}currentAccount=value.account;$('state').textContent=value.state+' · '+value.mode;$('info').replaceChildren();for(const [name,key] of [['账号','account'],['最近意愿','choice'],['下次考虑','next_check'],['阅读结果','last_round'],['模型用量','model_usage'],['待核对评论','unresolved']]){$('info').append(el('dt',name),el('dd',value[key]||'—'))}$('operation').textContent=value.operation||'';if(typeof value.qr==='string'&&value.qr.startsWith('data:image/png;base64,')){$('qr').src=value.qr;$('qr').hidden=false}else{$('qr').removeAttribute('src');$('qr').hidden=true}if(value.pause_reason&&value.pause_reason!=='无')$('state').textContent+=' · '+value.pause_reason;return changed}
async function refresh(append=false){if(busy)return;const own=++generation;loading=true;controls();if(!append)next='';try{const status=await window.maibot.query('overview');if(own!==generation)return;const changed=overview(status);if(changed){append=false;$('journal').replaceChildren();next=''}const result=await window.maibot.query('journal',{day:first?'today':$('day').value,before:append?next:'',query:$('search').value.trim()});if(own!==generation)return;if(first){$('day').value=result.today;first=false}draw(result.entries,append);next=result.next;note('');if(!result.logged_in){$('journal').replaceChildren(el('p','登录B站后，新的阅读经历会留在这里。','empty'))}}catch(e){if(own===generation){note('手记读取失败：'+e.message,true);if(first)$('journal').replaceChildren();}}finally{if(own===generation){loading=false;controls()}}}
async function command(action){if(busy||loading)return;busy=true;controls();try{const result=await window.maibot.action('command',{command:'/bili_auto '+action});if(!result?.ok)throw new Error(result?.message||'操作未完成');note(result.message);busy=false;await refresh()}catch(e){note(e.message,true)}finally{busy=false;controls()}}
async function archive(page=1){if(busy)return;const own=++archiveGeneration,account=currentAccount;archiveLoading=true;controls();try{const value=await window.maibot.query('records',{kind:$('archiveKind').value,search:$('archiveSearch').value.trim(),page});if(own!==archiveGeneration||account!==currentAccount)return;$('archiveRows').replaceChildren();for(const row of value.rows){const item=el('article',undefined,'entry');item.append(el('small',row.time+' · '+row.outcome+' · '+row.mode),el('h3',row.title||row.bvid||'历史记录'));for(const [label,key] of [['当时内容','comment'],['说明','reason'],['收到的回复','incoming'],['回复目标','target']])if(row[key])item.append(el('p',label+'：'+row[key],'quote'));if(/^BV[0-9A-Za-z]{10}$/.test(row.bvid)){const a=el('a','查看原视频');a.href='https://www.bilibili.com/video/'+row.bvid;a.target='_blank';a.rel='noopener noreferrer';item.append(a)}$('archiveRows').append(item)}archivePage=value.pagination.page;archivePages=value.pagination.pages;$('archivePage').textContent=archivePage+' / '+archivePages;$('archiveNotice').textContent=value.rows.length?'':'没有找到匹配的历史记录'}catch(e){if(own===archiveGeneration)$('archiveNotice').textContent='历史读取失败：'+e.message}finally{if(own===archiveGeneration){archiveLoading=false;controls()}}}
async function manageAction(name,args={}){if(busy||loading)return;busy=true;controls();try{const result=await window.maibot.action(name,args);if(!result?.ok)throw Error(result?.message||'操作未完成');if(name==='logout'){++generation;currentAccount=null;next='';lastDay='';clearArchive();$('journal').replaceChildren();$('info').replaceChildren();$('operation').textContent='';$('state').textContent='已退出账号';$('qr').removeAttribute('src');$('qr').hidden=true;$('archive').open=false}note(result.message);busy=false;await refresh()}catch(e){note(/cancelled|取消/i.test(e.message)?'已取消操作':e.message,!/cancelled|取消/i.test(e.message))}finally{busy=false;controls()}}
$('archive').ontoggle=()=>{if($('archive').open)archive(1)};$('archiveFilters').onsubmit=e=>{e.preventDefault();archive(1)};$('archiveKind').onchange=()=>archive(1);$('archivePrev').onclick=()=>archive(archivePage-1);$('archiveNext').onclick=()=>archive(archivePage+1);$('logout').onclick=()=>manageAction('logout');$('ackForm').onsubmit=e=>{e.preventDefault();if($('ackForm').reportValidity())manageAction('ack',{bvid:$('ackBvid').value.trim()})};
$('filters').onsubmit=e=>{e.preventDefault();first=false;refresh()};$('day').onchange=()=>{first=false;refresh()};$('refresh').onclick=()=>refresh();$('more').onclick=()=>refresh(true);$('all').onclick=()=>{first=false;$('day').value='';refresh()};$('today').onclick=()=>{first=true;refresh()};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));
window.maibot.ready.then(()=>{refresh();setInterval(async()=>{if(document.hidden||loading||busy||!$('manage').open)return;const own=generation;try{const value=await window.maibot.query('overview');if(own===generation&&overview(value))refresh()}catch(e){if(own===generation)note('状态读取失败：'+e.message,true)}},5000)});
})();
</script>
